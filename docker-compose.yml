services:
  api:
    build: .
    ports:
      - "5174:5174"
    environment:
      NODE_ENV: production
      PORT: "5174"
      # Temporary, for the ongoing candidate-fallback debugging — shows every
      # yt-dlp command, cache hit/miss, and full error object, not just the
      # always-on warnings. Remove (or set to "0") once things settle down.
      HIPSTER_DEBUG: "1"
      # See downloadClip.ts — a headless server has no real logged-in
      # browser profile to pull YouTube cookies from, so this points at
      # a cookies.txt exported ahead of time (see the deploy runbook).
      YTDLP_COOKIES_FILE: /app/cookies.txt
      # Docker has no --cookies-from-browser fallback at all (no browser
      # exists in the container) — a missing/broken cookies.txt here means
      # every song is silently unplayable. See server.ts's startup check:
      # unconditional here, unlike the opt-in `dev:require-cookies` script
      # used for local dev, since there's no legitimate reason to run this
      # container without a valid cookie file.
      REQUIRE_COOKIES: "1"
    volumes:
      # Not :ro: yt-dlp's --cookies flag treats this file as a live cookie
      # jar, not just an input — it rewrites it (refreshed/rotated cookies)
      # every time it exits. A read-only mount makes that write fail with
      # "Read-only file system", which crashes yt-dlp even after a
      # successful download, so downloadClip.ts reports every song as
      # failed.
      - ./cookies.txt:/app/cookies.txt
      # Persists downloaded songs across restarts/rebuilds — without
      # this, every `docker compose up --build` would re-download
      # everything from scratch.
      - ./apps/api/data/cache:/app/apps/api/data/cache
    restart: unless-stopped
